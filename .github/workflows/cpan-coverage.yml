name: Test Coverage

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest
    container: davorg/perl-coveralls:latest
    name: Test coverage
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install modules
        run: cpanm --notest --with-configure --installdeps .
      - name: Configure distribution
        run: |
          if [ -f Build.PL ]; then
            perl Build.PL
          elif [ -f Makefile.PL ]; then
            perl Makefile.PL
          else
            echo "::error::No Build.PL or Makefile.PL found"
            exit 1
          fi
      - name: Coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cover -test -report Coveralls

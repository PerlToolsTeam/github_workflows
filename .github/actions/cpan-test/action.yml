name: "CPAN unit tests"
description: "Run standard CPAN-style unit tests for a distribution"

inputs:
  perl_version:
    description: "Perl version to use (e.g. 5.42)"
    required: true

  os:
    description: "Runner label (e.g. ubuntu-latest, windows-latest, macos-latest)"
    required: true

  testing_context:
    description: "JSON array of testing context flags, e.g. ['author','release']"
    required: false
    default: '[ ]'

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5

    - name: Set up perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: ${{ inputs.perl_version }}

    - name: Perl version
      run: perl -V
      shell: ${{ startsWith(inputs.os, 'windows') && 'powershell' || 'bash' }}

    - name: Upgrade CPAN toolchain (metadata + installer) [Windows]
      if: startsWith(inputs.os, 'windows')
      shell: pwsh
      run: |
        cpanm --notest --quiet --reinstall `
          ExtUtils::MakeMaker `
          Module::Build `
          CPAN::Meta `
          CPAN::Meta::Requirements `
          CPAN::Meta::YAML `
          Parse::CPAN::Meta `
          JSON::PP `
          Test::Harness

    - name: Upgrade CPAN toolchain (metadata + installer) [Unix]
      if: ${{ !startsWith(inputs.os, 'windows') }}
      shell: bash
      run: |
        cpanm --notest --quiet --reinstall \
          ExtUtils::MakeMaker \
          Module::Build \
          CPAN::Meta \
          CPAN::Meta::Requirements \
          CPAN::Meta::YAML \
          Parse::CPAN::Meta \
          JSON::PP \
          Test::Harness

    - name: Show toolchain versions [Windows]
      if: startsWith(inputs.os, 'windows')
      shell: pwsh
      run: |
        perl -MExtUtils::MakeMaker -e "print qq(ExtUtils::MakeMaker $ExtUtils::MakeMaker::VERSION\n)"
        perl -MCPAN::Meta -e "print qq(CPAN::Meta $CPAN::Meta::VERSION\n)"
        perl -MParse::CPAN::Meta -e "print qq(Parse::CPAN::Meta $Parse::CPAN::Meta::VERSION\n)"

    - name: Set up MSVC build tools
      if: startsWith(inputs.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install modules
      run: |
        cpanm --notest --with-configure --with-develop --no-man-pages --installdeps .
      shell: ${{ startsWith(inputs.os, 'windows') && 'powershell' || 'bash' }}

    - name: Configure with Makefile.PL
      id: configure-with-eumm
      if: ${{ hashFiles('Makefile.PL') != '' }}
      run: |
        perl Makefile.PL
        make
      shell: ${{ startsWith(inputs.os, 'windows') && 'powershell' || 'bash' }}

    - name: Configure with Build.PL
      id: configure-with-mb
      if: ${{ hashFiles('Build.PL') != '' }}
      run: |
        perl Build.PL
        ./Build
      shell: ${{ startsWith(inputs.os, 'windows') && 'powershell' || 'bash' }}

    - name: Set testing context
      if: ${{ !startsWith(inputs.os, 'windows') }}
      run: |
        printf '%s\n' '${{ inputs.testing_context }}' | \
        jq -r '.[]' | \
        tr '[:lower:]' '[:upper:]' | \
        while read -r item; do
          printf '%s_TESTING=1\n' "${item}" >> "${GITHUB_ENV}"
        done
      shell: bash

    - name: Run tests with make
      if: steps.configure-with-eumm.outcome == 'success'
      run: |
        make TEST_VERBOSE=1 test
      shell: ${{ startsWith(inputs.os, 'windows') && 'powershell' || 'bash' }}

    - name: Run tests with ./Build
      if: steps.configure-with-mb.outcome == 'success'
      run: |
        ./Build verbose=1 test
      shell: ${{ startsWith(inputs.os, 'windows') && 'powershell' || 'bash' }}

    - name: Archive CPAN logs on Windows
      if: ${{ failure() && startsWith(inputs.os, 'windows') }}
      uses: actions/upload-artifact@v5
      with:
        name: cpan_log-results-${{ github.run_id }}-${{ github.job }}
        path: C:\Users\RUNNER~1\.cpanm\work\*\build.log
        retention-days: 5

    - name: Archive CPAN logs on Unix
      if: ${{ failure() && !startsWith(inputs.os, 'windows') }}
      uses: actions/upload-artifact@v5
      with:
        name: cpan_log-results-${{ github.run_id }}-${{ github.job }}
        path: /home/runner/.cpanm/work/*/build.log
        retention-days: 5
